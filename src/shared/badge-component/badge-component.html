@switch (badgeColor()) {
    @case ("red") {
        <span class="inline-flex items-center rounded-md bg-red-50 px-2 py-1 text-xs font-medium text-red-700 inset-ring inset-ring-red-600/10">{{displayText()}}</span>
    }
    @case ("yellow") {
        <span class="inline-flex items-center rounded-md bg-yellow-50 px-2 py-1 text-xs font-medium text-yellow-800 inset-ring inset-ring-yellow-600/20">{{displayText()}}</span>
    }
    @case ("gray"){
        <span class="inline-flex items-center rounded-md bg-gray-50 px-2 py-1 text-xs font-medium text-gray-600 inset-ring inset-ring-gray-500/10">{{displayText()}}</span>
    }
    @case ("green") {
        <span class="inline-flex items-center rounded-md bg-green-50 px-2 py-1 text-xs font-medium text-green-600 inset-ring inset-ring-green-500/10">{{displayText()}}</span>
    }
    @default {
        <span class="inline-flex items-center rounded-md bg-purple-50 px-2 py-1 text-xs font-medium text-purple-700 inset-ring inset-ring-purple-700/10">{{displayText()}}</span>
    }
}
